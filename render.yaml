services:
  - type: web
    name: idsp-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:////data/idsp.db
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: idsp-data
      mountPath: /data
      sizeGB: 1
